plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'kodclient' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

tasks.withType(Javadoc) {
    enabled = false
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

configurations {
    fatRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Fabric Loader БЕЗ exclude sponge-mixin — Knot требует ASM + sponge-mixin
    // на classpath (LoaderUtil.verifyClasspath). Без них Knot падает в <clinit>.
    fatRuntime "net.fabricmc:fabric-loader:${project.loader_version}"
    fatRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Явные зависимости Fabric Loader (ASM, sponge-mixin, tiny-remapper) —
    // они не приходят транзитивно через fatRuntime coordinates, добавляем явно.
    fatRuntime "org.ow2.asm:asm:9.9"
    fatRuntime "org.ow2.asm:asm-analysis:9.9"
    fatRuntime "org.ow2.asm:asm-commons:9.9"
    fatRuntime "org.ow2.asm:asm-tree:9.9"
    fatRuntime "org.ow2.asm:asm-util:9.9"
    fatRuntime "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
    fatRuntime "net.fabricmc:tiny-remapper:0.12.1"
    fatRuntime "org.jetbrains:annotations:26.0.2"
}

tasks.register('fatClient', Jar) {
    dependsOn jar
    archiveClassifier.set('versionka')
    zip64 = true
    // EXCLUDE (дефолт): MinecraftGameProvider ищет игру по classpath jar'ов —
    // дублирующиеся META-INF/services и классы от разных исходных jar'ов ломают
    // его (zip overlapped components). Оставляем по одному экземпляру.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'ru.kod.client.KodClientBootstrap'
    }
    // === 1. Сам мод (remapJar) ===
    from(jar.archiveFile) {
        exclude 'META-INF/**'
        exclude '*-dev.jar', '*-sources.jar'
        exclude 'ru/**'
    }
    from('build/classes/java/client') {
        exclude 'META-INF/**'
    }
    from('build/classes/java/main') {
        exclude 'META-INF/**'
    }
    from('build/resources/main') {
        exclude 'META-INF/**'
    }
    from('build/resources/client') {
        exclude 'META-INF/**'
    }
    // === 2. Fabric Loader + Fabric API + Minecraft ===
    // ВАЖНО: Fabric Loader и Fabric API должны лежать в jar'е как ОТДЕЛЬНЫЕ zip'ы
    // в META-INF/jars/ (Fabric's nested jar format), а не распакованы в корень.
    // Иначе Knot не видит fabricloader и fabric-api как моды (HARD_DEP_NO_CANDIDATE).
    // ВАЖНО: KnotClient должен быть на classpath при запуске — поэтому
    // fabric-loader jar кладём и в корень (распакованно), и в META-INF/jars/.
    // Распакованный KnotClient на classpath позволяет Class.forName("...KnotClient")
    // найти его без URLClassLoader.
    from({
        configurations.fatRuntime.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        // Fabric Loader классы + его зависимости (ASM, sponge-mixin, tiny-remapper) —
        // в корень, чтобы KnotClient и его static initializer нашёл всё на classpath.
        // Без ASM Knot падает: "ASM not detected on the classpath".
        // ВАЖНО: META-INF/services/** НЕ исключаем — Knot ищет GameProvider
        // через ServiceLoader (META-INF/services/net.fabricmc.loader.impl.game.GameProvider).
        include 'net/fabricmc/loader/**'
        include 'net/fabricmc/api/**'
        include 'org/objectweb/asm/**'
        include 'org/spongepowered/asm/**'
        include 'net/fabricmc/tinyremapper/**'
        include 'org/jetbrains/annotations/**'
        include 'META-INF/services/**'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        exclude 'META-INF/versions/**'
    }
    from({
        configurations.fatRuntime.collect { it.isDirectory() ? it : it }
    }) {
        into 'META-INF/jars'
    }
    // Minecraft отдельно — в корень fat jar'а
    def loomCachePath = System.getenv('GRADLE_USER_HOME') != null
        ? "${System.getenv('GRADLE_USER_HOME')}/caches/fabric-loom"
        : "${layout.projectDirectory.asFile}/.ghome/caches/fabric-loom"
    def mcClientJar = fileTree(dir: loomCachePath, include: '**/minecraft-clientonly-*.jar')
        .files.find { it.name.contains('1.21.11') && !it.name.contains('intermediary') && !it.name.endsWith('.backup') }
    def mcCommonJar = fileTree(dir: loomCachePath, include: '**/minecraft-common-*.jar')
        .files.find { it.name.contains('1.21.11') && !it.name.contains('intermediary') && !it.name.endsWith('.backup') }
    assert mcClientJar != null : "minecraft-clientonly jar not found in Loom cache: ${loomCachePath}"
    assert mcCommonJar != null : "minecraft-common jar not found in Loom cache: ${loomCachePath}"
    from(zipTree(mcClientJar)) {
        exclude 'META-INF/**'
    }
    from(zipTree(mcCommonJar)) {
        exclude 'META-INF/**'
    }
    // LWJGL нативки: Mojang поставляет их как META-INF/<platform>/... внутри
    // lwjgl-*-natives-*.jar. Сохраняем именно такой путь — LWJGL резолвит нативки
    // через Configuration#getPlatform() и ищет их в META-INF/<platform>/...
    // внутри jar'ов на classpath. Наш бутстрап извлекает META-INF/<platform>/**
    // в .kodclient/natives/<platform>/ и прописывает в java.library.path.
    // ВАЖНО: runtimeClasspath содержит TP jars (minecraft-client.jar из Loom),
    // их НЕ распаковываем ещё раз — только natives.
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        include 'META-INF/linux/**', 'META-INF/windows/**', 'META-INF/macos/**'
    }
}
